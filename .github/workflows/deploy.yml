name: Deploy

# Builds the app and publishes it to GitHub Pages, which is what makes it
# installable: a PWA needs to be served over HTTPS from a real origin, so a
# local `dist/` folder cannot be installed no matter what the manifest says.
on:
  push:
    branches:
      - main
      - claude/church-matching-app-wiv21x
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Needed to see whether GitHub's own branch-source Pages build is still
  # running for this commit — see "Wait out" in the deploy job.
  actions: read

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on if it is off. It does NOT move an already-enabled
          # repository off the "deploy from a branch" source.
          #
          # While that source is set, GitHub runs its own pages-build-deployment
          # on every push as well, publishing the repository ROOT. The root
          # holds the unbuilt Vite index.html, which points at /src/main.tsx and
          # 404s in production — so whichever of the two finishes last decides
          # whether the site works, and it is a coin flip.
          #
          # The fix is one setting, and it has to be made by hand:
          #   Settings -> Pages -> Build and deployment -> Source -> GitHub Actions
          # After that this is the only publisher and the race is gone.
          enablement: true

      - name: Build
        # Pages serves a project site from /<repo>/, so assets, the manifest,
        # and the service worker scope all have to be built for that subpath.
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While the repository is on the "deploy from a branch" Pages source,
      # GitHub starts its own pages-build-deployment on the same commit, which
      # publishes the repository ROOT — the unbuilt Vite index.html, whose
      # /src/main.tsx 404s in production and renders a blank page.
      #
      # Both publish to the same site, so whichever finishes last wins, and the
      # two take about the same time. Rather than leave that to chance, wait for
      # GitHub's build to finish and deploy after it.
      #
      # This whole step is a no-op once the source is GitHub Actions, because no
      # such run is ever created. That remains the real fix:
      #   Settings -> Pages -> Build and deployment -> Source -> GitHub Actions
      - name: Wait out GitHub's branch-source Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Give the run a moment to be created before concluding there is none.
          sleep 15
          for _ in $(seq 1 40); do
            running=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq '[.workflow_runs[]
                     | select(.path == "dynamic/pages/pages-build-deployment")
                     | select(.status != "completed")] | length')
            if [ "$running" = "0" ]; then
              echo "No branch-source Pages build in flight; deploying."
              exit 0
            fi
            echo "Waiting for $running branch-source Pages build(s) to finish..."
            sleep 10
          done
          echo "::warning::Timed out waiting; deploying anyway. It may be overwritten."

      - id: deployment
        uses: actions/deploy-pages@v4
